# Desarrollo. Usa tus bases de MariaDB locales (backend/.env); no levanta una base propia, salvo los
# checadores de prueba, porque esa base real solo existe en el servidor de los biométricos.
#
#   cp backend/.env.example backend/.env    # y captura las credenciales
#   docker compose up -d
#   docker compose exec backend npm run migrate
#   docker compose exec backend npm run seed
#
# Aplicación: http://localhost:4260
services:
  frontend:
    image: node:24-alpine
    container_name: sisalidas-frontend
    working_dir: /app
    ports:
      - "4260:4200"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - /app/backend
    environment:
      CHOKIDAR_USEPOLLING: "true"
      BACKEND_HOST: backend
      BACKEND_PORT: "3070"
    command: >
      sh -c "npm install &&
      npm run start -- --host 0.0.0.0 --port 4200 --poll=1000"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: node:24-alpine
    container_name: sisalidas-backend
    working_dir: /app
    ports:
      - "127.0.0.1:3097:3070"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 3070
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "npm install && npm run start:dev"
    depends_on:
      checadores-prueba:
        condition: service_healthy
    restart: unless-stopped

  # Base de checadores de prueba, sin datos reales. En backend/.env:
  #   DB_CHECADORES_HOST=checadores-prueba
  #   DB_CHECADORES_USERNAME=root
  #   DB_CHECADORES_PASSWORD=checadores-local
  checadores-prueba:
    image: mariadb:10.5
    container_name: sisalidas-checadores-prueba
    environment:
      MARIADB_ROOT_PASSWORD: checadores-local
      MARIADB_DATABASE: checadores
      TZ: America/Mexico_City
    volumes:
      - checadores_data:/var/lib/mysql
      - ./backend/scripts/checadores-prueba.sql:/docker-entrypoint-initdb.d/01-checadores.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  frontend_node_modules:
  backend_node_modules:
  checadores_data:
